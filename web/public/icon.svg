<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <rect width="512" height="512" rx="128" fill="url(#bg-gradient)"/>
  <circle cx="256" cy="256" r="180" stroke="#14b8a6" stroke-width="16" stroke-opacity="0.3" fill="#0f172a" fill-opacity="0.8"/>
  <circle cx="256" cy="256" r="140" stroke="#2dd4bf" stroke-width="4" stroke-dasharray="8 8" stroke-opacity="0.6"/>
  
  <!-- Gauge Arc -->
  <path d="M 150 310 A 130 130 0 1 1 362 310" fill="none" stroke="url(#arc-gradient)" stroke-width="20" stroke-linecap="round"/>
  
  <!-- Lightning Energy Symbol -->
  <path d="M275 140L195 270H265L235 372L325 242H255L275 140Z" fill="url(#bolt-gradient)" filter="url(#glow)"/>
  
  <!-- Digital Pulse Dots -->
  <circle cx="256" cy="410" r="8" fill="#38bdf8"/>
  <circle cx="226" cy="410" r="5" fill="#38bdf8" fill-opacity="0.5"/>
  <circle cx="286" cy="410" r="5" fill="#38bdf8" fill-opacity="0.5"/>
  
  <defs>
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f172a"/>
      <stop offset="0.5" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#042f2e"/>
    </linearGradient>
    <linearGradient id="arc-gradient" x1="150" y1="200" x2="362" y2="310" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10b981"/>
      <stop offset="0.5" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="bolt-gradient" x1="200" y1="140" x2="320" y2="370" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fef08a"/>
      <stop offset="0.5" stop-color="#facc15"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="180" y="130" width="160" height="260" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
</svg>
